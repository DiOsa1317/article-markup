<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Практика верстки</title>
    <link rel="stylesheet" href="styles.css">
    <style> 
        /* Стили для страницы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
        }

        .site-header {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .header-inner{
            display: flex;
            flex-direction: column; 
            align-items: flex-start; 
            padding: 20px 32px;
        }

        .logo-image {
            height: 50px;
        }

        .nav-list {
            text-decoration: none;
            display: flex;
            flex-direction:  row;
            gap: 32px;
            list-style: none;

        }

        .nav-item {
            text-decoration: none;
            font-family:LucidaGrande;
            font-size:24px;
            color:#333333;
            text-align:left;
            line-height:36px;
        }
        .nav-item.active .nav-link{
            font-family:LucidaGrande;
            font-size:24px;
            color:#d0021b;
            text-align:left;
            line-height:36px;
        }
        .nav-link {
            text-decoration: none;
            font-family:LucidaGrande;
            font-size:24px;
            color:#333333;
            text-align:left;
            line-height:36px;
        }
        .nav-wrapper {
            display: flex;
            flex-direction: row;
            gap: 32px;
            color: #333333;
        }
        .nav-wrapper::after {
            content: "";
            flex-grow: 1;
            color: #000;
        }

        .nav-link:hover {
            text-decoration: underline;
            font-family:LucidaGrande;
            font-size:24px;
            color:#333333;
            text-align:left;
            line-height:36px;
        }
    </style>
</head>
<body>
    <header class="site-header">
    <div class="header-inner">
        <a href="#" class="logo">
            <img src="responsive-design/2744EFD6-B878-4DCB-B0D5-526F1B233733/FF01C60E-3379-4ED9-B65C-DE7F425CF688@1x.png" alt="Логотип" class="logo-image">
        </a>

        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="#" class="nav-link">Обо мне</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Проекты</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Портфолио</a></li>
                <li class="nav-item active"><a href="#" class="nav-link">Блог</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Контакты</a></li>
            </ul>
        </nav>
    </div>
</header>

</body>
</html>
